name: Jobs

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 6:17 AM New York (EDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: write the report only, never touch Notion"
        type: boolean
        default: true
      mock:
        description: "Mock LLM: fake model calls, $0, no XAI_API_KEY needed"
        type: boolean
        default: false
      lean:
        description: "Lean: Referral Mapper only on scores >= 75"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check setup
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f notion_ids.json ]; then
            echo "Skipping the scheduled run: notion_ids.json is missing. Run the **Setup Notion** workflow first." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Jobs pipeline
        if: steps.setup.outputs.skip != 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROFILE_PRIVATE: ${{ secrets.PROFILE_PRIVATE }}
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
            [ "${{ inputs.mock }}" = "true" ] && args="$args --mock"
            [ "${{ inputs.lean }}" = "true" ] && args="$args --lean"
          fi
          python -m boards run jobs $args

      - uses: actions/upload-artifact@v4
        if: always() && steps.setup.outputs.skip != 'true'
        with:
          name: jobs-report
          path: out/
          retention-days: 14
